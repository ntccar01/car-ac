function render() {
  if (!S) return; renderScene();
  $('#sMode').textContent = MODE[S.mode] + '｜' + (S.meth === 'auto' ? '自動機' : '手動'); const hb = $('#hintB'); hb.style.display = S.mode === 'guide' || S.end || S.meth === 'auto' ? 'none' : ''; hb.disabled = S.mode === 'exam' && S.hints >= HINT_MAX;
  hb.textContent = S.mode === 'exam' ? `💡 提示（−5 分，剩 ${HINT_MAX - S.hints} 次）` : '💡 提示（練習不扣分）'; $('#sScore').textContent = S.major ? 0 : score();
  $('#sPpe').innerHTML = S.meth === 'auto' ? '' : `🥽 ${S.ppe.g ? '✔' : '✘'}　🧤 ${S.ppe.h ? '✔' : '✘'}　引擎 ${S.eng ? '運轉' : '熄火'}　A/C ${S.ac ? 'ON' : 'OFF'}`;
  recCard();
  if (!S.end) {
    if (S.meth === 'auto') renderAuto();
    else if (S.mode === 'guide') { const nowI = STEPS.findIndex(([k]) => !S.done.has(k) && !waived(k)); $('#stepTitle').textContent = '作業程序（導引）';
      $('#steps').innerHTML = STEPS.map(([k, s], i) => waived(k) || (k === 'recov' && !S.resid) ? '' : `<li class="${S.done.has(k) ? 'done' : i === nowI ? 'now' : ''}">${esc(s)}${i === nowI ? `<div class="why">💬 ${esc(WHY[k])}</div>` : ''}</li>`).join(''); }
    else { const w = curWork(); $('#stepTitle').textContent = '📋 工作單';
      $('#steps').innerHTML = WORK.map((x, i) => { const all = x.k.every(k => S.done.has(k) || waived(k)); return `<li class="wk ${all ? 'done' : i === w ? 'now' : ''}"><b>${esc(x.t)}</b>${all ? ' ✔' : ''}<br><span class="hint">${esc(x.d)}</span></li>`; }).join('')
        + (S.leak && S.recHold && S.recHold.ok ? '<li class="wk now"><b>⚠ 系統有洩漏</b><br><span class="hint">停止充填，按「完成作業」回報老師</span></li>' : ''); }
  }
  $('#hintMsg').innerHTML = S.hintMsg && !S.end ? '💡 ' + esc(S.hintMsg) : '';
  $('#log').innerHTML = S.log.join('');
}
function renderAuto() {
  const L = AUTO(); $('#stepTitle').textContent = '🖥 自動機操作';
  if (S.ai >= L.length) { $('#steps').innerHTML = '<li class="done">全部完成！按「完成練習」看結果。</li><li><button class="pri" id="aFin">完成練習</button></li>'; $('#aFin').onclick = finish; return; }
  const st = L[S.ai], ord = S.aOrd && S.aOrd.i === S.ai ? S.aOrd.o : (S.aOrd = { i: S.ai, o: st.o.map((_, k) => k).sort(() => Math.random() - .5) }).o;
  const q = st.q.replace(/\{SPEC\}/g, S.spec);
  $('#steps').innerHTML = `<li style="list-style:none;margin-left:-20px"><b>第 ${S.ai + 1} 步：</b>${esc(q)}</li>` + ord.map(k => `<li style="list-style:none;margin-left:-20px"><button data-k="${k}" style="width:100%;text-align:left;margin:4px 0">${esc(st.o[k][0].replace(/\{SPEC\}/g, S.spec))}</button></li>`).join('') + `<li style="list-style:none;margin-left:-20px" class="hint" id="aFb"></li>`;
  $('#steps').querySelectorAll('[data-k]').forEach(b => b.onclick = () => { const o = st.o[+b.dataset.k]; S.lastAct = Date.now();
    if (o[1]) { log(`✔ ${o[0].replace(/\{SPEC\}/g, S.spec)}`, 'g'); S.ai++; S.aOrd = null; render(); if (S.mode === 'guide') $('#aFb') && 0; }
    else { S.ded['autoWrong' + S.ai] = 5; DED['autoWrong' + S.ai] = [`第 ${S.ai + 1} 步選錯`, 5]; CAT.程序.push('autoWrong' + S.ai); log(`✘ ${o[0]}：${o[2]}`, 'd'); b.disabled = true; $('#aFb').innerHTML = `✘ ${esc(o[2])}`; $('#sScore').textContent = score(); $('#log').innerHTML = S.log.join(''); } });
}
$('#sv').addEventListener('click', e => { const t = e.target.closest('[data-o]'); const b = $('#sv').getBoundingClientRect(), x = (e.clientX - b.left) * 1000 / b.width, y = (e.clientY - b.top) * 1000 / b.width;
  $('#menu').style.display = 'none'; if (t) act(t.dataset.o, x, y); });
$('#hintB').onclick = () => { if (!S || S.end) return; const n = nextStep(); if (!n) return;
  if (S.mode === 'exam') { if (S.hints >= HINT_MAX) return; S.hints++; S.ded['hint' + S.hints] = 5; DED['hint' + S.hints] = ['使用提示卡（第 ' + S.hints + ' 次）', 5]; CAT.提示.push('hint' + S.hints); }
  S.hintMsg = HINT[n[0]] || ''; S.hintStep = n[0]; S.lastAct = Date.now(); render(); };

  const go = mode => { who.cls = $('#cS').value; who.grp = String(Math.min(30, Math.max(1, Math.round(+$('#gS').value || 1)))); who.op = $('#oS').value; const meth = mode === 'exam' ? 'man' : $('#mS').value;

    $('#bR').onclick = () => location.reload(); fresh(mode, meth); };
  $('#bG').onclick = () => go('guide'); $('#bP').onclick = () => go('mock'); $('#bE').onclick = () => go('exam');
}
