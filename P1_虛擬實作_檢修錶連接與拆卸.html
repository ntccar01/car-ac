<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>虛擬實作檢定｜冷媒檢修錶連接與拆卸</title>
<style>
:root{--bg:#0a1120;--panel:#121c30;--panel2:#18243d;--line:#2a3a5c;--ink:#e6ecf5;--mut:#9fb0cf;--acc:#ffb020;--acc2:#38c6ff;--ok:#3ad07a;--bad:#ff5d5d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 16px;border-bottom:1px solid var(--line)}
header h1{font-size:20px;margin:0}header .tag{background:var(--acc);color:#1a1200;font-weight:700;border-radius:8px;padding:2px 10px}
header a{color:var(--acc2);margin-left:auto}
.main{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:12px;padding:12px 16px}
@media(max-width:980px){.main{grid-template-columns:1fr}}
.stage{position:relative;background:#0d1526;border:1px solid var(--line);border-radius:14px;overflow:hidden}
svg{display:block;width:100%;height:auto;touch-action:manipulation;user-select:none}
.side{display:flex;flex-direction:column;gap:10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.card h3{margin:0 0 8px;font-size:16px;color:var(--acc)}
.stat{display:flex;gap:10px;flex-wrap:wrap;font-size:15px}.stat b{font-size:20px}
.steps{margin:0;padding-left:22px;font-size:14px;line-height:1.55;max-height:320px;overflow:auto}.steps li.done{color:var(--ok)}.steps li.now{color:var(--acc);font-weight:700}
.log{font-size:13px;line-height:1.5;max-height:180px;overflow:auto;color:var(--mut)}.log .m{color:var(--bad);font-weight:700}.log .d{color:#ffb86b}.log .g{color:var(--ok)}
button{font:inherit;font-size:15px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);padding:7px 12px;cursor:pointer}
button.pri{background:var(--acc);border-color:var(--acc);color:#1a1200;font-weight:700}button:disabled{opacity:.45;cursor:default}
select,input{font:inherit;font-size:15px;padding:5px 8px;border-radius:8px;border:1px solid var(--line);background:#0d1526;color:var(--ink)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0}
#menu{position:absolute;display:none;z-index:5;background:#0b1424f0;border:2px solid var(--acc);border-radius:12px;padding:8px;min-width:230px;box-shadow:0 8px 30px #000a}
#menu .t{font-size:13px;color:var(--mut);margin:0 4px 6px}#menu button{display:block;width:100%;text-align:left;margin:4px 0;font-size:15px}
#alert{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:#000a;z-index:8}
#alert .box{background:var(--panel);border:3px solid var(--bad);border-radius:16px;padding:20px 24px;max-width:560px;text-align:center}
#alert h2{margin:0 0 8px;color:var(--bad)}#alert p{font-size:17px;line-height:1.6}
.result{font-size:15px;line-height:1.6}.result table{width:100%;border-collapse:collapse;font-size:14px}.result td{border-bottom:1px solid var(--line);padding:4px 6px}
.pass{color:var(--ok);font-size:26px;font-weight:800}.fail{color:var(--bad);font-size:26px;font-weight:800}
.cert{border:3px double var(--ok);border-radius:12px;padding:10px;margin-top:8px;text-align:center}
.hint{font-size:13px;color:var(--mut)}
.steps .why{font-weight:400;color:#ffd23f;font-size:13px;margin:2px 0 4px}.steps li.wk{margin-bottom:6px}.steps li.blink{background:#ffb02033;border-radius:6px}
</style></head><body>
<script src="firebase-config.js"></script><script src="score.js"></script>
<header><span class="tag">虛擬實作</span><h1>冷媒檢修錶 連接與拆卸</h1><span class="hint">通過「檢定模式」才能到實車操作</span><a href="index.html">← 課程首頁</a></header>
<div class="main">
  <div class="stage"><svg id="sv" viewBox="0 0 1000 620"></svg><div id="menu"></div>
    <div id="alert"><div class="box"><h2 id="aT"></h2><p id="aP"></p><button class="pri" id="aB">知道了</button></div></div></div>
  <div class="side">
    <div class="card" id="setup"></div>
    <div class="card"><div class="stat"><span>模式：<b id="sMode">—</b></span><span>⏱ <b id="sTime">0:00</b></span><span>分數 <b id="sScore">100</b></span></div>
      <div class="row hint" id="sPpe"></div>
      <div class="row"><button id="hintB" style="display:none">💡 提示</button></div><div id="hintMsg" style="color:#ffd23f;font-size:15px;font-weight:700"></div></div>
    <div class="card" id="recCard" style="display:none"><h3>📝 讀錶紀錄</h3>
      <div class="row">低壓錶 <input id="rLo" type="number" style="width:90px"> kPa</div>
      <div class="row">高壓錶 <input id="rHi" type="number" style="width:90px"> kPa</div>
      <div class="row"><select id="rJ"><option value="">判斷結果…</option><option value="eq">高低壓相同：靜態平衡壓力</option><option value="hl">高壓高於低壓：系統運轉中</option><option value="zero">兩錶為 0：系統無冷媒</option></select></div>
      <div class="row"><button class="pri" id="rGo">送出紀錄</button><span class="hint" id="rMsg"></span></div></div>
    <div class="card" id="stepCard"><h3 id="stepTitle">📋 工作單</h3><ol class="steps" id="steps"></ol></div>
    <div class="card"><h3>操作紀錄</h3><div class="log" id="log"></div></div>
  </div>
</div>
<script>
/* ===== R-134a 飽和壓力（錶壓 kPa）；與課本表 2-1 一致（20℃ 470.3、25℃ 563.9、30℃ 668.7） ===== */
const R134A = [[-26.07, .1013], [-20, .1327], [-10, .2006], [0, .2928], [5, .3497], [10, .4146], [20, .5717], [25, .6654], [30, .7702], [35, .8870], [40, 1.0166], [45, 1.1599], [50, 1.3179], [55, 1.4920], [60, 1.6818]];
const satP = T => { for (let i = 1; i < R134A.length; i++) if (T <= R134A[i][0]) { const [a, p] = R134A[i - 1], [b, q] = R134A[i]; return (p + (q - p) * (T - a) / (b - a) - .1013) * 1000; } return 915; };
const $ = s => document.querySelector(s), esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const store = { get(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) { } } };
const LIMIT = 600;   // 檢定時間 10 分鐘
const PASS = 80;

/* ===== 評分項目（同紙本實作檢核表；技術士術科評分表寫法） ===== */
const MAJOR = {
  ppe: '未配戴護目鏡及防油污手套即操作冷媒相關部件',
  run: '引擎運轉中拆裝檢修錶（皮帶、風扇捲入危險）',
  vent: '冷媒排放到大氣中',
  core: '以工具壓閥嘴測試，冷媒噴出',
  time: '超過檢定時間（10 分鐘）未完成',
};
const DED = {
  acOff: ['連接前未關閉空調開關', 5],
  capBay: ['保護蓋未鎖在錶組固定座（隨手放置）', 5],
  noClean: ['連接前未檢視、清潔檢修接口與閥嘴', 5],
  hvCheck: ['連接前未確認手動閥關閉', 5],
  soCheck: ['連接前未確認切斷閥關閉', 5],
  over: ['手動閥過度扭緊', 5],
  wrong: ['快速接頭拿錯接口（藍接 L、紅接 H）', 5],
  noSupport: ['連接時未用手支撐管路', 5],
  record: ['讀錶紀錄或判斷錯誤', 10],
  rag: ['拆卸接頭時未以抹布包覆', 5],
  order: ['拆卸順序錯誤（應先拆低壓、再拆高壓）', 5],
  wrench: ['以工具鎖緊保護蓋（應徒手）', 5],
  capMiss: ['保護蓋未裝回', 10],
  hvEnd: ['完成時手動閥未關閉', 5],
  soEnd: ['完成時切斷閥未關閉', 5],
  notRec: ['未讀錶紀錄', 10],
  hint: ['使用提示卡', 5],
};
const STEPS = [
  ['ppe', '配戴護目鏡與防油污手套'],
  ['off', '關閉空調、引擎熄火'],
  ['caps', '拆下 H、L 保護蓋，鎖在錶組固定座'],
  ['clean', '檢視並清潔兩個檢修接口與閥嘴'],
  ['hv', '順時針旋入，確認兩個手動閥關閉'],
  ['so', '逆時針旋出，確認兩個切斷閥關閉'],
  ['conL', '支撐管路，藍色快速接頭接 L'],
  ['conH', '支撐管路，紅色快速接頭接 H'],
  ['open', '順時針旋入兩個切斷閥，頂開閥嘴'],
  ['rec', '讀錶並記錄、判斷'],
  ['soOff', '拆卸：逆時針旋出，關閉兩個切斷閥'],
  ['offL', '抹布包住，先拆低壓藍色接頭'],
  ['offH', '抹布包住，再拆高壓紅色接頭'],
  ['capOn', '檢查密封圈，徒手鎖回 H、L 保護蓋'],
  ['fin', '按「完成作業」'],
];

/* 工作單（只寫要做什麼，不寫怎麼做；同技術士術科的工作說明） */
const WORK = [
  { t: '作業前準備', d: '個人防護、車輛狀態', k: ['ppe', 'off'] },
  { t: '連接冷媒檢修錶', d: '高、低壓兩側', k: ['caps', 'clean', 'hv', 'so', 'conL', 'conH', 'open'] },
  { t: '讀取並記錄系統壓力', d: '填寫讀錶紀錄並判斷', k: ['rec'] },
  { t: '拆卸檢修錶並復原', d: '設備歸位、接口復原，按「完成作業」', k: ['soOff', 'offL', 'offH', 'capOn', 'fin'] },
];
/* 導引模式：每一步的理由 */
const WHY = {
  ppe: '冷媒在大氣壓下約 −26℃ 就沸騰，噴到眼睛或皮膚會瞬間凍傷。',
  off: '引擎運轉時皮帶、風扇在轉，手伸進引擎室有被捲入的危險。',
  caps: '保護蓋鎖在錶組固定座，才不會遺失或掉進引擎室。',
  clean: '接口髒污會讓快速接頭密封不良而漏冷媒；也順便看閥嘴有沒有損傷。',
  hv: '手動閥若開著，等一下切斷閥頂開閥嘴時，冷媒會直接從中央軟管排出。',
  so: '切斷閥若是旋入狀態，接頭一接上就會頂開閥嘴，冷媒噴出。',
  conL: '藍色＝低壓，接管徑較粗、蓋子標 L 的接口；一手支撐管路，避免管路受力變形。',
  conH: '紅色＝高壓，接管徑較細、蓋子標 H 的接口。',
  open: '切斷閥順時針旋入，才會頂開閥嘴，錶才讀得到系統壓力。',
  rec: '引擎熄火時，高低壓會平衡，等於當時氣溫下 R-134a 的飽和壓力（看綠色溫度圈）。',
  soOff: '拆接頭前要先關閉切斷閥（逆時針旋出），否則拆下時冷媒會噴出。',
  offL: '先拆低壓藍色接頭，用抹布包住，防止冷媒、冷凍油噴濺。',
  offH: '高壓側壓力較高，拆紅色接頭時更要用抹布包住、小心噴出。',
  capOn: '檢查保護蓋密封圈，徒手鎖緊即可，用工具會鎖壞。',
  fin: '確認全部復原後，按右下角「完成作業」。',
};
/* 提示卡：只指出「下一步處理哪個東西」，不說方向與做法 */
const HINT = {
  ppe: '看看左上角的護具架。', off: '看看右上角駕駛座的開關。', caps: '看看 H、L 檢修接口上面。', clean: '保護蓋拆了，接口本身要先處理一下。',
  hv: '連接前，看看檢修錶兩側的手動閥。', so: '連接前，看看兩個快速接頭上方的切斷閥。', conL: '藍色接頭要接到哪一個接口？', conH: '紅色接頭要接到哪一個接口？',
  open: '接頭接上了，但錶還沒讀到壓力。', rec: '點錶面放大，讀出數值後填寫讀錶紀錄。', soOff: '要拆接頭了，先看看接頭上方。', offL: '可以開始拆接頭了，想想先拆哪一側。',
  offH: '還有一個接頭沒拆。', capOn: '接口要恢復原狀。', fin: '都完成了嗎？檢查一下就按「完成作業」。',
};
const CAT = { 程序: ['acOff', 'hvCheck', 'soCheck', 'noClean', 'order', 'capMiss'], 操作技能: ['capBay', 'over', 'wrong', 'noSupport', 'rag', 'wrench', 'hvEnd', 'soEnd'], 紀錄判讀: ['record', 'notRec'], 提示: ['hint'] };
const HINT_MAX = 3, HINT_PASS = 2, IDLE = 45;
const MODE = { guide: '練習 1：導引', mock: '練習 2：工作單', exam: '檢定' };
let S, timer = null, who = { cls: store.get('act_cls'), grp: store.get('act_grp'), op: store.get('p1_op') || '1' };
function fresh(mode) {
  const r = () => Math.random() < .5, amb = 24 + Math.floor(Math.random() * 9);
  S = { mode, amb, t0: Date.now(), sec: 0, end: false,
    ppe: { g: false, h: false }, eng: true, ac: true,
    cap: { L: 'on', H: 'on' }, clean: { L: false, H: false },
    hv: { L: r(), H: r() }, so: { L: r(), H: r() }, hvChk: { L: false, H: false }, soChk: { L: false, H: false },
    cpl: { L: 'hang', H: 'hang' }, hold: null, rec: null, removed: [],
    ded: {}, major: null, log: [], done: new Set(), hints: 0, lastAct: Date.now(), nudged: false, flash: 0, hintMsg: '' };
  if (!S.hv.L && !S.hv.H && !S.so.L && !S.so.H) S.hv.L = true;   // 至少一個閥一開始是開的，逼學生檢查
  clearInterval(timer); timer = setInterval(tick, 500);
  log(`開始${MODE[mode]}。外氣溫度 ${amb}℃，車輛怠速運轉、空調開啟中。`, 'g');
  render();
}
function tick() { if (!S || S.end) return; S.sec = (Date.now() - S.t0) / 1000; $('#sTime').textContent = fmt(S.sec);
  if (S.mode === 'exam' && S.sec > LIMIT) major('time');
  if (S.mode !== 'guide' && !S.nudged && Date.now() - S.lastAct > IDLE * 1000) { S.nudged = true; S.flash = Date.now(); const w = curWork();
    if (w >= 0) { log(`⏳ 停很久了：目前在工作單第 ${w + 1} 項「${WORK[w].t}」。`, 'd'); render(); } }
  if (S.flash && Date.now() - S.flash < 4500) { const el = document.querySelector('.wk.now'); if (el) el.classList.toggle('blink'); } }
const curWork = () => WORK.findIndex(w => w.k.some(k => !S.done.has(k)));
const nextStep = () => STEPS.find(([k]) => !S.done.has(k));
const fmt = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
function log(s, c = '') { S.log.unshift(`<div class="${c}">[${fmt(S.sec || 0)}] ${s}</div>`); }
function ded(k, side = '') { const key = k + side; if (S.ded[key]) return; S.ded[key] = DED[k][1]; log(`扣分 −${DED[k][1]}：${DED[k][0]}${side ? `（${side === 'L' ? '低壓' : '高壓'}）` : ''}`, 'd'); }
function major(k, extra = '') {
  if (S.end) return;
  log(`重大缺失：${MAJOR[k]}${extra}`, 'm');
  if (S.mode === 'exam') { S.major = k; finish(); }
  else { if (!S.majors) S.majors = []; S.majors.push(k); showAlert('⚠ 重大缺失', `${MAJOR[k]}${extra}<br><br>檢定模式中，這一項會<b>直接不及格</b>。<br>（練習模式可以繼續操作）`); }
}
const score = () => Math.max(0, 100 - Object.values(S.ded).reduce((a, b) => a + b, 0));
const touchRef = () => { if (!S.ppe.g || !S.ppe.h) { major('ppe'); return false; } return true; };
const engCheck = () => { if (S.eng) { major('run'); return false; } return true; };
/* 冷媒排放判斷：接頭在接口上＋切斷閥頂開閥嘴＋同側手動閥開（中央軟管沒接設備）→ 排放 */
function ventCheck() {
  for (const s of ['L', 'H']) if (S.cpl[s] === s && S.so[s] && S.hv[s]) { major('vent', `（${s === 'L' ? '低壓' : '高壓'}手動閥開著，冷媒由中央軟管噴出）`); return true; }
  return false;
}
const connected = () => S.cpl.L === 'L' && S.cpl.H === 'H' && S.so.L && S.so.H;
const pressure = () => connected() ? Math.round(satP(S.amb)) : 0;

/* ===== 動作選單 ===== */
function menu(x, y, title, items) {
  const m = $('#menu'), st = $('.stage').getBoundingClientRect(), sv = $('#sv').getBoundingClientRect(), k = sv.width / 1000;
  m.innerHTML = `<div class="t">${title}</div>` + items.map((it, i) => `<button data-i="${i}">${it[0]}</button>`).join('') + '<button data-i="x">✕ 取消</button>';
  m.style.display = 'block'; let L = x * k + 10, T = y * k + 10; if (L + 250 > st.width) L = st.width - 260; if (T + m.offsetHeight > st.height) T = Math.max(4, st.height - m.offsetHeight - 6);
  m.style.left = L + 'px'; m.style.top = T + 'px';
  m.querySelectorAll('button').forEach(b => b.onclick = e => { e.stopPropagation(); m.style.display = 'none'; if (b.dataset.i !== 'x') { items[+b.dataset.i][1](); after(); } });
}
function after() { checkSteps(); if (S.hintMsg && S.hintStep !== nextStep()?.[0]) S.hintMsg = ''; S.hintStep = nextStep()?.[0]; render(); }
function showAlert(t, p) { $('#aT').textContent = t; $('#aP').innerHTML = p; $('#alert').style.display = 'flex'; }
$('#aB').onclick = () => { $('#alert').style.display = 'none'; };

function act(obj, x, y) {
  if (!S || S.end) return;
  S.lastAct = Date.now(); S.nudged = false; S.flash = 0;
  const side = obj.slice(-1), nm = side === 'L' ? '低壓' : '高壓';
  // 手上拿著接頭時，點接口 → 連接
  if (S.hold && obj.startsWith('port')) return connectTo(side, x, y);
  if (S.hold && !obj.startsWith('port') && !/^(gL|gH|zoomX)$/.test(obj)) { log(`把${S.hold === 'L' ? '藍色' : '紅色'}接頭放回固定座。`); S.cpl[S.hold] = 'hang'; S.hold = null; return after(); }
  switch (obj) {
    case 'gog': return menu(x, y, '護目鏡', [['配戴護目鏡', () => { S.ppe.g = true; log('配戴護目鏡。', 'g'); }]]);
    case 'glv': return menu(x, y, '防油污手套', [['配戴防油污手套', () => { S.ppe.h = true; log('配戴防油污手套。', 'g'); }]]);
    case 'acsw': return menu(x, y, `空調開關（目前：${S.ac ? 'ON' : 'OFF'}）`, [[S.ac ? '關閉空調 A/C' : '開啟空調 A/C', () => { S.ac = !S.ac; log(`空調 ${S.ac ? 'ON' : 'OFF'}。`); }]]);
    case 'key': return menu(x, y, `點火開關（目前：${S.eng ? '引擎運轉' : '熄火'}）`, [[S.eng ? '引擎熄火（OFF）' : '發動引擎', () => { if (S.eng && S.ac) ded('acOff'); S.eng = !S.eng; log(S.eng ? '發動引擎。' : '引擎熄火。'); }]]);
    case 'capL': case 'capH':
      if (S.cap[side] === 'on') return menu(x, y, `${nm}側保護蓋（${side}）`, [

$('#sv').addEventListener('click', e => { const t = e.target.closest('[data-o]'); const b = $('#sv').getBoundingClientRect(), x = (e.clientX - b.left) * 1000 / b.width, y = (e.clientY - b.top) * 1000 / b.width;
  $('#menu').style.display = 'none'; if (t) act(t.dataset.o, x, y); else if (S && S.hold) act('none', x, y); });

/* ===== 開始畫面 ===== */
function setup() {
  const CLS = (window.CLASS_LIST && window.CLASS_LIST.length) ? window.CLASS_LIST : ['汽車三甲'], NG = Math.min(30, Math.max(1, +window.GROUP_COUNT || 11));
  $('#setup').innerHTML = `<h3>開始</h3>
    <div class="row">班級 <select id="cS">${CLS.map(c => `<option ${c === who.cls ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select>
      組別 <input id="gS" type="number" min="1" max="30" value="${esc(who.grp || 1)}" style="width:64px">
      操作者 <select id="oS">${[1, 2, 3].map(n => `<option ${String(n) === who.op ? 'selected' : ''}>${n}</option>`).join('')}</select></div>
    <div class="hint">組內每位同學都要各自通過檢定（操作者 1、2）。不輸入姓名。</div>
    <div class="row"><button id="bG">🧭 練習 1：導引</button><button id="bP">📋 練習 2：工作單</button><button class="pri" id="bE">🎫 檢定（10 分鐘）</button></div>
    <div class="hint">練習 1：每一步都有提示和理由。練習 2：只有工作單，跟檢定一樣，但重大缺失不會中止。<br>檢定：只有工作單；💡 提示卡每次 −5 分、最多 3 次（用超過 2 次不及格）；重大缺失立即不及格；80 分以上及格，成績上傳給老師。</div>`;
  const go = mode => { who.cls = $('#cS').value; who.grp = String(Math.min(30, Math.max(1, Math.round(+$('#gS').value || 1)))); who.op = $('#oS').value;
    store.set('act_cls', who.cls); store.set('act_grp', who.grp); store.set('p1_op', who.op);
    $('#setup').innerHTML = `<h3>${esc(who.cls)} 第 ${esc(who.grp)} 組・操作者 ${esc(who.op)}</h3><div class="hint">點畫面上的物件（護具、開關、保護蓋、接口、手動閥、接頭、切斷閥）選擇動作。</div><div class="row"><button id="bR">↺ 重新開始</button></div>`;
    $('#bR').onclick = () => location.reload(); fresh(mode); };
  $('#bG').onclick = () => go('guide'); $('#bP').onclick = () => go('mock'); $('#bE').onclick = () => go('exam');
}
setup();
