<style>

<script src="firebase-config.js"></script><script src="score.js"></script>
<header><span class="tag">虛擬實作 P0</span><h1>冷媒循環 實車巡檢</h1><span class="hint">元件指認・管路追蹤・量測判斷</span><a href="index.html">← 課程首頁</a></header>
<div class="main">
  <div class="stage"><svg id="sv" viewBox="0 0 1000 620"></svg><div id="menu"></div>
    <div id="alert"><div class="box"><h2 id="aT"></h2><p id="aP"></p><button class="pri" id="aB">知道了</button></div></div></div>
  <div class="side">
    <div class="card" id="setup"></div>
    <div class="card"><div class="stat"><span>模式：<b id="sMode">—</b></span><span>⏱ <b id="sTime">0:00</b></span><span>分數 <b id="sScore">100</b></span></div>
      <div class="row hint" id="sPpe"></div>
      <div class="row"><button id="flowB" style="display:none">🔁 標示冷媒流向</button><button id="hintB" style="display:none">💡 提示</button></div>
      <div id="hintMsg" style="color:#ffd23f;font-size:15px;font-weight:700"></div></div>

      <div class="row">高壓錶 <input id="gHP" type="number"> kPa → 飽和溫度 <input id="gHT" type="number" step="0.5"> ℃</div>
      <table class="rec"><tr><th>點</th><th>高／低壓側</th><th>實測 ℃</th><th>冷媒狀態</th><th></th></tr><tbody id="recRows"></tbody></table>
      <div class="hint">判斷狀態：實測溫度比該側飽和溫度<b>高</b>＝過熱氣態；<b>低</b>＝過冷液態；<b>差不多（±2℃）</b>＝霧狀（正在沸騰或凝結）。</div>
      <div class="row"><button id="chkB" style="display:none">檢查紀錄</button><span class="hint" id="chkMsg"></span></div></div>

  </div>
</div>
<script>
/* ===== R-134a 飽和表（℃, 絕對 MPa）；錶壓 kPa＝(絕對−0.1013)×1000；與課本表 2-1 一致 ===== */
const R134A = [[-26.07, .1013], [-20, .1327], [-10, .2006], [0, .2928], [5, .3497], [10, .4146], [20, .5717], [25, .6654], [30, .7702], [35, .8870], [40, 1.0166], [45, 1.1599], [50, 1.3179], [55, 1.4920], [60, 1.6818], [65, 1.8890], [70, 2.1168]];
const satT = g => { const a = g / 1000 + .1013; for (let i = 1; i < R134A.length; i++) { const [t1, p1] = R134A[i - 1], [t2, p2] = R134A[i]; if (a <= p2 || i === R134A.length - 1) return t1 + (t2 - t1) * (a - p1) / (p2 - p1); } };
const satP = T => { for (let i = 1; i < R134A.length; i++) { const [t1, p1] = R134A[i - 1], [t2, p2] = R134A[i]; if (T <= t2 || i === R134A.length - 1) return (p1 + (p2 - p1) * (T - t1) / (t2 - t1) - .1013) * 1000; } };
/* 課本表 6-5 正常範圍中間值（外氣 25／30／35℃） */
const lin = (x, pts) => { for (let i = 1; i < pts.length; i++) if (x <= pts[i][0]) { const [a, p] = pts[i - 1], [b, q] = pts[i]; return p + (q - p) * (x - a) / (b - a); } return pts[pts.length - 1][1]; };
const PHof = a => lin(a, [[25, 1030], [30, 1365], [35, 1435]]), PLof = a => lin(a, [[25, 245], [30, 320], [35, 385]]);
const $ = s => document.querySelector(s), esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const store = { get(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) { } } };
const fmt = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
const LIMIT = 900, PASS = 80, HINT_MAX = 3, HINT_PASS = 2, IDLE = 45;
const MODE = { guide: '練習 1：導引', mock: '練習 2：工作單', exam: '檢定' };

/* ===== 元件與名稱、功能 ===== */
const NAMES = ['壓縮機', '冷凝器', '蒸發器', '儲液器', '蓄液器', '膨脹閥', '毛細管（限流管）', '水箱'];
const FUNCS = ['熱交換：放熱（冷媒凝結）', '熱交換：吸熱（冷媒汽化）', '供應動能（壓縮冷媒）', '節流降壓', '過濾、乾燥、暫存冷媒（高壓側）', '氣液分離、防液擠（低壓側）'];
const COMP = {
  comp: { n: '壓縮機', f: 2 }, cond: { n: '冷凝器', f: 0 }, evap: { n: '蒸發器', f: 1 },
  rec: { n: '儲液器', f: 4 }, acc: { n: '蓄液器', f: 5 }, txv: { n: '膨脹閥', f: 3 }, ori: { n: '毛細管（限流管）', f: 3 },
};
const FLOW = { txv: ['comp', 'cond', 'rec', 'txv', 'evap'], ori: ['comp', 'cond', 'ori', 'evap', 'acc'] };
/* 管路段：pts、真實側別 */
const SEGS = {
  txv: { dis: { p: [[95, 250], [95, 80], [90, 80]], s: 'H' }, liqA: { p: [[560, 95], [596, 95]], s: 'H' }, liqB: { p: [[607, 150], [607, 432]], s: 'H' },
    evIn: { p: [[607, 462], [607, 500]], s: 'L' }, suc: { p: [[430, 536], [430, 425], [160, 425], [160, 300], [140, 300]], s: 'L' } },
  ori: { dis: { p: [[95, 250], [95, 80], [90, 80]], s: 'H' }, liq: { p: [[560, 95], [607, 95], [607, 404]], s: 'H' },
    evIn: { p: [[607, 440], [607, 500]], s: 'L' }, sucA: { p: [[430, 536], [430, 425], [400, 425]], s: 'L' }, sucB: { p: [[340, 425], [160, 425], [160, 300], [140, 300]], s: 'L' } },
};
const SEGNAME = { dis: '壓縮機→冷凝器', liqA: '冷凝器→儲液器', liqB: '儲液器→膨脹閥', liq: '冷凝器→毛細管', evIn: '節流後→蒸發器', suc: '蒸發器→壓縮機', sucA: '蒸發器→蓄液器', sucB: '蓄液器→壓縮機' };
/* 量測點（真值在 fresh() 依外氣計算）；hz：附近危險 */
const PTS = {
  txv: { A: { x: 95, y: 205, side: 'H', hz: 'belt' }, B: { x: 578, y: 95, side: 'H', hz: 'fan' }, C: { x: 607, y: 482, side: 'L' }, D: { x: 430, y: 470, side: 'L' }, E: { x: 300, y: 425, side: 'L' } },
  ori: { A: { x: 95, y: 205, side: 'H', hz: 'belt' }, B: { x: 585, y: 95, side: 'H', hz: 'fan' }, C: { x: 607, y: 470, side: 'L' }, D: { x: 430, y: 470, side: 'L' }, E: { x: 270, y: 425, side: 'L' } },
};
const PTNAME = { A: '壓縮機出口', B: '冷凝器出口', C: '蒸發器入口', D: '蒸發器出口', E: '壓縮機入口' };
const STATE = ['氣態', '液態', '霧狀（液＋氣）'];

const MAJOR = { belt: '引擎運轉中，手伸過皮帶附近量測（捲入危險）', fan: '手伸過運轉中的冷凝器風扇量測（捲入危險）', burn: '徒手觸摸高溫的高壓管（燙傷）', time: '超過檢定時間（15 分鐘）未完成' };
const DED = {
  ppe: ['未配戴護目鏡、手套即進行巡檢', 5], idName: ['元件名稱錯誤', 4], idFunc: ['元件功能錯誤', 2], idMiss: ['元件未指認', 4],
  flow: ['冷媒流向順序錯誤或未完成', 10], seg: ['管路高低壓標示錯誤或未標示', 3], far: ['測溫儀距離太遠（讀到周圍平均溫度）', 5], touch: ['徒手觸摸管路', 5],
  noMeas: ['未實際量測就填寫溫度', 5], gP: ['壓力錶讀數錯誤', 5], gT: ['飽和溫度換算錯誤', 5], rSide: ['量測點高低壓側判斷錯誤', 2], rTemp: ['量測溫度紀錄錯誤', 2], rState: ['冷媒狀態判斷錯誤', 4], hint: ['使用提示卡', 5],
};
const CAT = { 元件指認: ['idName', 'idFunc', 'idMiss'], 流向與管路: ['flow', 'seg'], 量測操作: ['ppe', 'far', 'touch', 'noMeas'], 紀錄判讀: ['gP', 'gT', 'rSide', 'rTemp', 'rState'], 提示: ['hint'] };
const STEPS = [
  ['ppe', '配戴護目鏡與手套'], ['ir', '拿起紅外線測溫儀'], ['id', '指認 5 個元件（名稱＋功能）'], ['flow', '按「標示冷媒流向」，從壓縮機依序點元件'],
  ['seg', '標示每一段管路是高壓側或低壓側'], ['gauge', '放大讀高、低壓錶，換算飽和溫度填入紀錄表'], ['meas', '量測 5 個量測點的管路溫度'],
  ['rec', '紀錄表：每一點的側別、實測溫度、冷媒狀態'], ['fin', '按「完成作業」'],
];
const WORK = [
  { t: '作業前準備', d: '個人防護、量測工具', k: ['ppe', 'ir'] },
  { t: '元件指認', d: '找出冷氣系統的 5 個元件，說出名稱與功能', k: ['id'] },
  { t: '冷媒流向與高低壓', d: '標示冷媒流動順序、每段管路屬於哪一側', k: ['flow', 'seg'] },
  { t: '系統量測', d: '讀檢修錶、量測 5 個點的管路溫度', k: ['gauge', 'meas'] },
  { t: '判斷與紀錄', d: '完成巡檢紀錄表，按「完成作業」', k: ['rec', 'fin'] },
];
const WHY = {
  ppe: '巡檢時引擎和冷氣都在運轉，管路有高溫也有低溫，接頭附近可能噴出冷媒。', ir: '用測溫儀量管路溫度，比用手摸準確又安全。',
  id: '點車上的每個元件，先選名稱、再選功能。這台車可能是膨脹閥系統，也可能是毛細管系統，看清楚有沒有儲液器或蓄液器。',
  flow: '冷媒從壓縮機出發：壓縮機 → 冷凝器 → …… 回到壓縮機。依照順序點元件。', seg: '壓縮機把壓力升高、膨脹閥（毛細管）把壓力降低，這兩個元件就是高低壓的分界。',
  gauge: '點檢修錶面放大，讀出壓力，再看同方向的綠色刻度就是飽和溫度。', meas: '測溫儀靠近管路（約 5 cm）量才準；靠近皮帶、風扇的點，要從側面避開。',
  rec: '把實測溫度和同一側的飽和溫度比較：高＝氣態、低＝液態、差不多＝霧狀。', fin: '全部填好、檢查過後，按「完成作業」。',
};
const HINT = {
  ppe: '看看右側工具架上的護具。', ir: '工具架上還有一樣量測工具。', id: '還有元件沒有指認（點車上的元件）。', flow: '按右邊的「🔁 標示冷媒流向」，從壓縮機開始點。',
  seg: '還有管路沒有標示高壓或低壓（點管路）。', gauge: '點右上角檢修錶的錶面放大來讀。', meas: '還有黃色量測點沒有量（拿著測溫儀點它）。', rec: '紀錄表還有欄位沒填。', fin: '都完成了嗎？檢查後按「完成作業」。',
};

let S = null, timer = null, who = { cls: store.get('act_cls'), grp: store.get('act_grp'), op: store.get('p1_op') || '1' };
function fresh(mode) {
  const sys = Math.random() < .5 ? 'txv' : 'ori', amb = 25 + Math.floor(Math.random() * 11);
  const PH = Math.round(PHof(amb)), PL = Math.round(PLof(amb)), TC = satT(PH), TE = satT(PL);
  const truth = { A: [TC + 18, 0], B: [TC - 6, 1], C: [TE, 2], D: sys === 'txv' ? [TE + 5, 0] : [TE, 2], E: [TE + (sys === 'txv' ? 7 : 4), 0] };
  const nz = () => Math.round((Math.random() - .5) * 8) / 10;
  Object.keys(truth).forEach(k => truth[k][0] = Math.round((truth[k][0] + nz()) * 10) / 10);
  const order = ['A', 'B', 'C', 'D', 'E'].sort(() => Math.random() - .5);   // 量測點編號隨機
  S = { mode, sys, amb, PH, PL, TC, TE, truth, order, t0: Date.now(), sec: 0, end: false,
    ppe: { g: false, h: false }, ir: false, ans: {}, flow: [], flowMode: false, segMark: {}, meas: {}, far: {}, zoom: null,
    ded: {}, major: null, majors: [], log: [], done: new Set(), hints: 0, lastAct: Date.now(), nudged: false, flash: 0, hintMsg: '' };
  clearInterval(timer); timer = setInterval(tick, 500);
  buildRec(); log(`開始${MODE[mode]}。外氣 ${amb}℃，引擎怠速、冷氣全開運轉中；檢修錶已由老師接好。`, 'g'); render();
}
function tick() {
  if (!S || S.end) return; S.sec = (Date.now() - S.t0) / 1000; $('#sTime').textContent = fmt(S.sec);
  if (S.mode === 'exam' && S.sec > LIMIT) major('time');
  if (S.mode !== 'guide' && !S.nudged && Date.now() - S.lastAct > IDLE * 1000) { S.nudged = true; S.flash = Date.now(); const w = curWork(); if (w >= 0) { log(`⏳ 停很久了：目前在工作單第 ${w + 1} 項「${WORK[w].t}」。`, 'd'); render(); } }
  if (S.flash && Date.now() - S.flash < 4500) { const el = document.querySelector('.wk.now'); if (el) el.classList.toggle('blink'); }
  if (!S.zoom) { const f = document.getElementById('fanRot'); if (f) f.setAttribute('transform', `rotate(${(Date.now() / 3) % 360} 0 0)`); }
}
const curWork = () => WORK.findIndex(w => w.k.some(k => !S.done.has(k)));
const nextStep = () => STEPS.find(([k]) => !S.done.has(k));
function log(s, c = '') { S.log.unshift(`<div class="${c}">[${fmt(S.sec || 0)}] ${s}</div>`); }
function ded(k, tag = '') { const key = k + (tag ? '|' + tag : ''); if (S.ded[key]) return; S.ded[key] = DED[k][1]; log(`扣分 −${DED[k][1]}：${DED[k][0]}${tag ? '（' + tag + '）' : ''}`, 'd'); }
function major(k) {
  if (S.end) return; log(`重大缺失：${MAJOR[k]}`, 'm');
  if (S.mode === 'exam') { S.major = k; finish(); }
  else { S.majors.push(k); showAlert('⚠ 重大缺失', `${MAJOR[k]}<br><br>檢定模式中，這一項會<b>直接不及格</b>。<br>（練習模式可以繼續操作）`); }
}
const score = () => Math.max(0, 100 - Object.values(S.ded).reduce((a, b) => a + b, 0));
function showAlert(t, p) { $('#aT').textContent = t; $('#aP').innerHTML = p; $('#alert').style.display = 'flex'; }
$('#aB').onclick = () => { $('#alert').style.display = 'none'; };

/* ===== 動作選單 ===== */
function menu(x, y, title, items) {
  const m = $('#menu'), st = $('.stage').getBoundingClientRect(), sv = $('#sv').getBoundingClientRect(), k = sv.width / 1000;
  m.innerHTML = `<div class="t">${title}</div>` + items.map((it, i) => `<button data-i="${i}">${it[0]}</button>`).join('') + '<button data-i="x">✕ 取消</button>';
  m.style.display = 'block'; let L = x * k + 10, T = y * k + 10; if (L + 260 > st.width) L = Math.max(4, st.width - 270); if (T + m.offsetHeight > st.height) T = Math.max(4, st.height - m.offsetHeight - 6);

    <text x="${cx}" y="${cy - 80}" fill="${col}" font-size="24" font-weight="800" text-anchor="middle">${lo ? '低壓錶' : '高壓錶'}</text>
    <line x1="${cx}" y1="${cy}" x2="${nx}" y2="${ny}" stroke="#fff" stroke-width="5" stroke-linecap="round"/><circle cx="${cx}" cy="${cy}" r="10" fill="#ffb020"/>
    <text x="${cx}" y="604" fill="#ffb020" font-size="16" text-anchor="middle">點任意處關閉</text></g>`;
}

/* ===== 畫面 ===== */
const poly = pts => pts.map(p => p.join(',')).join(' ');
function render() {
  if (!S) return;
  const sys = S.sys, segs = SEGS[sys], pts = PTS[sys], gv = S.gv || [S.PH, S.PL];
  const mark = k => S.segMark[k] === 'H' ? '#d24a4a' : S.segMark[k] === 'L' ? '#3a7fd0' : '#8a98ad';
  const lbl = c => { const a = S.ans[c], fi = S.flow.indexOf(c); return (a ? a.n : '') + (fi >= 0 ? `　#${fi + 1}` : ''); };
  const comp = (c, x, y, w, h, body) => `<g data-o="c:${c}" style="cursor:pointer">${body}<rect x="${x - 6}" y="${y - 6}" width="${w + 12}" height="${h + 12}" fill="transparent" stroke="${S.flowMode ? '#ffd23f' : 'transparent'}" stroke-dasharray="6 4" stroke-width="2" rx="8"/>
    ${lbl(c) ? `<rect x="${x + w / 2 - 70}" y="${y + h + 8}" width="140" height="24" rx="6" fill="#1b2840" stroke="#ffd23f"/><text x="${x + w / 2}" y="${y + h + 25}" fill="#ffd23f" font-size="13" font-weight="700" text-anchor="middle">${esc(lbl(c))}</text>` : ''}</g>`;
  let svg = `<rect width="1000" height="620" fill="#0d1526"/>
  <!-- 車體 -->
  <rect x="30" y="30" width="650" height="425" rx="18" fill="#101a2c" stroke="#2a3a5c"/><text x="40" y="24" fill="#9fb0cf" font-size="13">▲ 車頭（引擎室，俯視）</text>
  <rect x="30" y="462" width="950" height="150" rx="14" fill="#141d30" stroke="#2a3a5c"/><text x="40" y="606" fill="#9fb0cf" font-size="13">車內儀錶板（掀開）</text>
  <line x1="30" y1="458" x2="980" y2="458" stroke="#4a5d7d" stroke-width="4" stroke-dasharray="10 6"/><text x="380" y="452" fill="#4a5d7d" font-size="12">防火牆</text>
  <!-- 非冷媒元件（干擾） -->
  <g data-o="d:rad" style="cursor:pointer"><rect x="90" y="114" width="470" height="26" rx="4" fill="#2a3448" stroke="#4a5d7d"/></g>
  <g data-o="d:fan" style="cursor:pointer">${[250, 410].map(x => `<g transform="translate(${x},176)"><circle r="28" fill="#16223a" stroke="#4a5d7d" stroke-width="2"/><g ${x === 250 ? 'id="fanRot"' : ''}>${[0, 90, 180, 270].map(a => `<ellipse rx="20" ry="6" transform="rotate(${a})" fill="#5c6f8a"/>`).join('')}</g></g>`).join('')}<text x="330" y="214" fill="#9fb0cf" font-size="12" text-anchor="middle">電動風扇（運轉中）</text></g>
  <g data-o="d:eng" style="cursor:pointer"><rect x="190" y="230" width="330" height="165" rx="14" fill="#232f45" stroke="#4a5d7d"/><text x="355" y="318" fill="#9fb0cf" font-size="20" text-anchor="middle">引擎</text><circle cx="335" cy="380" r="22" fill="#16223a" stroke="#8ea3bf" stroke-width="3"/></g>
  <line x1="95" y1="323" x2="320" y2="362" stroke="#5c6f8a" stroke-width="6"/><line x1="95" y1="367" x2="330" y2="402" stroke="#5c6f8a" stroke-width="6"/><text x="200" y="400" fill="#9fb0cf" font-size="12">皮帶（運轉中）</text>
  <g data-o="d:blw" style="cursor:pointer"><circle cx="672" cy="518" r="24" fill="#16223a" stroke="#4a5d7d" stroke-width="2"/><text x="672" y="558" fill="#9fb0cf" font-size="12" text-anchor="middle">鼓風機</text></g>`;
  // 管路（點擊標示高低壓）
  Object.entries(segs).forEach(([k, s]) => { svg += `<polyline points="${poly(s.p)}" fill="none" stroke="${mark(k)}" stroke-width="11" stroke-linejoin="round" stroke-linecap="round"/>
    <polyline data-o="s:${k}" points="${poly(s.p)}" fill="none" stroke="transparent" stroke-width="26" style="cursor:pointer"/>`; });
  // 元件
  svg += comp('comp', 50, 255, 90, 70, `<rect x="50" y="255" width="90" height="70" rx="10" fill="#2a3b5e" stroke="#8ea3bf" stroke-width="2"/><circle cx="95" cy="345" r="22" fill="#16223a" stroke="#8ea3bf" stroke-width="3"/>`);
  svg += comp('cond', 90, 55, 470, 52, `<rect x="90" y="55" width="470" height="52" rx="6" fill="#1e2b44" stroke="#8ea3bf" stroke-width="2"/>${Array.from({ length: 46 }, (_, i) => `<line x1="${98 + i * 10}" y1="60" x2="${98 + i * 10}" y2="102" stroke="#3a4a66"/>`).join('')}<polyline points="95,72 555,72 555,90 95,90" fill="none" stroke="#8a98ad" stroke-width="5"/>`);
  if (sys === 'txv') { svg += comp('rec', 590, 70, 34, 80, `<rect x="590" y="70" width="34" height="80" rx="10" fill="#1b2840" stroke="#8ea3bf" stroke-width="2"/>`);
    svg += comp('txv', 591, 432, 32, 30, `<rect x="591" y="432" width="32" height="30" rx="5" fill="#5d7396" stroke="#8ea3bf" stroke-width="2"/>`); }
  else { svg += comp('ori', 597, 404, 20, 36, `<rect x="597" y="404" width="20" height="36" rx="4" fill="#e0a040" stroke="#8ea3bf" stroke-width="2"/>`);
    svg += comp('acc', 340, 398, 60, 54, `<rect x="340" y="398" width="60" height="54" rx="12" fill="#1b2840" stroke="#8ea3bf" stroke-width="2"/>`); }
  svg += comp('evap', 440, 486, 200, 64, `<rect x="440" y="486" width="200" height="64" rx="6" fill="#1e2b44" stroke="#8ea3bf" stroke-width="2"/>${Array.from({ length: 19 }, (_, i) => `<line x1="${448 + i * 10}" y1="490" x2="${448 + i * 10}" y2="546" stroke="#3a4a66"/>`).join('')}<polyline points="607,500 450,500 450,518 630,518 630,536 440,536" fill="none" stroke="#8a98ad" stroke-width="5"/>`);
  // 檢修接口與檢修錶
  const hp = [607, 230];
  svg += `<circle cx="${hp[0]}" cy="${hp[1]}" r="9" fill="#ff5d5d"/><text x="${hp[0] + 14}" y="${hp[1] + 5}" fill="#ff7070" font-size="12">H 接口</text><circle cx="210" cy="425" r="9" fill="#38c6ff"/><text x="198" y="447" fill="#38c6ff" font-size="12">L 接口</text>
    <path d="M${hp[0]} ${hp[1]} C 660 230, 820 240, 900 205" fill="none" stroke="#e04848" stroke-width="3" stroke-dasharray="8 6"/><path d="M210 425 C 190 470, 660 470, 690 380 S 760 240, 780 205" fill="none" stroke="#2f8fe0" stroke-width="3" stroke-dasharray="8 6"/>
    <rect x="700" y="30" width="285" height="180" rx="12" fill="#121c30" stroke="#2a3a5c"/><text x="712" y="50" fill="#9fb0cf" font-size="13">檢修錶（老師已接好）🔍 點錶面放大</text>`;
  const mg = (cx, v, max, col, id, nm) => { const ang = (135 + 270 * Math.min(1, Math.max(0, v / max))) * Math.PI / 180;
    return `<g data-o="${id}" style="cursor:zoom-in"><circle cx="${cx}" cy="128" r="58" fill="#0d1526" stroke="${col}" stroke-width="5"/>${Array.from({ length: 11 }, (_, i) => { const b = (135 + 27 * i) * Math.PI / 180; return `<line x1="${cx + Math.cos(b) * 50}" y1="${128 + Math.sin(b) * 50}" x2="${cx + Math.cos(b) * 42}" y2="${128 + Math.sin(b) * 42}" stroke="#c9d3e0" stroke-width="2"/>`; }).join('')}
      <line x1="${cx}" y1="128" x2="${cx + Math.cos(ang) * 44}" y2="${128 + Math.sin(ang) * 44}" stroke="#fff" stroke-width="3" stroke-linecap="round"/><circle cx="${cx}" cy="128" r="5" fill="#ffb020"/><text x="${cx}" y="160" fill="${col}" font-size="13" font-weight="700" text-anchor="middle">${nm}</text></g>`; };
  svg += mg(780, gv[1], 1500, '#38c6ff', 'gL', '低壓') + mg(910, gv[0], 3500, '#ff5d5d', 'gH', '高壓');
  // 工具架
  svg += `<rect x="700" y="222" width="285" height="96" rx="12" fill="#121c30" stroke="#2a3a5c"/><text x="712" y="242" fill="#9fb0cf" font-size="13">工具架</text>
    <g data-o="gog" style="cursor:pointer;opacity:${S.ppe.g ? .3 : 1}"><text x="750" y="290" font-size="34" text-anchor="middle">🥽</text><text x="750" y="308" fill="#e6ecf5" font-size="12" text-anchor="middle">護目鏡</text></g>
    <g data-o="glv" style="cursor:pointer;opacity:${S.ppe.h ? .3 : 1}"><text x="842" y="290" font-size="34" text-anchor="middle">🧤</text><text x="842" y="308" fill="#e6ecf5" font-size="12" text-anchor="middle">手套</text></g>
    <g data-o="irT" style="cursor:pointer"><rect x="905" y="258" width="64" height="40" rx="8" fill="${S.ir ? '#ffd23f' : '#2a3448'}" stroke="#ffb020" stroke-width="2"/><text x="937" y="284" font-size="13" font-weight="700" text-anchor="middle" fill="${S.ir ? '#1a1200' : '#fff'}">🌡 測溫</text><text x="937" y="312" fill="#e6ecf5" font-size="11" text-anchor="middle">${S.ir ? '手上' : '紅外線測溫儀'}</text></g>`;
  // 量測點
  S.order.forEach((id, i) => { const P = pts[id], m = S.meas[id];
    svg += `<g data-o="p:${id}" style="cursor:pointer"><circle cx="${P.x}" cy="${P.y}" r="15" fill="${m !== undefined ? '#2f6b4a' : '#ffb020'}" stroke="#1a1200" stroke-width="2"/><text x="${P.x}" y="${P.y + 6}" font-size="16" font-weight="800" text-anchor="middle" fill="${m !== undefined ? '#fff' : '#1a1200'}">${i + 1}</text>
      ${m !== undefined ? `<rect x="${P.x + 16}" y="${P.y - 30}" width="66" height="22" rx="5" fill="#0b1424" stroke="#ffd23f"/><text x="${P.x + 49}" y="${P.y - 14}" fill="#ffd23f" font-size="13" font-weight="700" text-anchor="middle">${m.toFixed(1)}℃</text>` : ''}</g>`; });
  svg += `<g data-o="done" style="cursor:pointer"><rect x="820" y="520" width="150" height="50" rx="10" fill="#ffb020"/><text x="895" y="551" fill="#1a1200" font-size="17" font-weight="800" text-anchor="middle">完成作業 ✔</text></g>`;
  if (S.flowMode) svg += `<rect x="190" y="160" width="330" height="34" rx="8" fill="#ffd23f"/><text x="355" y="183" fill="#1a1200" font-size="15" font-weight="800" text-anchor="middle">標示流向中：從壓縮機起依序點元件（${S.flow.length}/5）</text>`;
  if (S.zoom) svg += bigGauge(S.zoom, S.zoom === 'L' ? gv[1] : gv[0]);
  $('#sv').innerHTML = svg; renderSide();
}
function renderSide() {
  $('#sMode').textContent = MODE[S.mode]; $('#sScore').textContent = S.major ? 0 : score();
  const hb = $('#hintB'); hb.style.display = S.mode === 'guide' || S.end ? 'none' : ''; hb.disabled = S.mode === 'exam' && S.hints >= HINT_MAX; hb.textContent = S.mode === 'exam' ? `💡 提示（−5 分，剩 ${HINT_MAX - S.hints} 次）` : '💡 提示（練習不扣分）';
  const fb = $('#flowB'); fb.style.display = S.end ? 'none' : ''; fb.className = S.flowMode ? 'on' : ''; fb.textContent = S.flowMode ? `🔁 標示流向中（${S.flow.length}/5）` : S.flow.length ? '🔁 重新標示冷媒流向' : '🔁 標示冷媒流向';
  $('#sPpe').innerHTML = `🥽 ${S.ppe.g ? '✔' : '✘'}　🧤 ${S.ppe.h ? '✔' : '✘'}　🌡 ${S.ir ? '手上' : '未拿'}　外氣 ${S.amb}℃`;
  if (!S.end) {
    if (S.mode === 'guide') { const nowI = STEPS.findIndex(([k]) => !S.done.has(k)); $('#stepTitle').textContent = '作業程序（導引）';
      $('#steps').innerHTML = STEPS.map(([k, s], i) => `<li class="${S.done.has(k) ? 'done' : i === nowI ? 'now' : ''}">${esc(s)}${i === nowI ? `<div class="why">💬 ${esc(WHY[k])}</div>` : ''}</li>`).join(''); }
    else { const w = curWork(); $('#stepTitle').textContent = '📋 工作單';
      $('#steps').innerHTML = WORK.map((x, i) => `<li class="wk ${x.k.every(k => S.done.has(k)) ? 'done' : i === w ? 'now' : ''}"><b>${esc(x.t)}</b>${x.k.every(k => S.done.has(k)) ? ' ✔' : ''}<br><span class="hint">${esc(x.d)}</span></li>`).join(''); }
  }
  $('#hintMsg').innerHTML = S.hintMsg && !S.end ? '💡 ' + esc(S.hintMsg) : '';
  $('#log').innerHTML = S.log.join('');
}
$('#sv').addEventListener('click', e => { const t = e.target.closest('[data-o]'), b = $('#sv').getBoundingClientRect(), x = (e.clientX - b.left) * 1000 / b.width, y = (e.clientY - b.top) * 1000 / b.width;
  $('#menu').style.display = 'none'; if (t) act(t.dataset.o, x, y); });

/* ===== 開始畫面 ===== */
function setup() {
  const CLS = (window.CLASS_LIST && window.CLASS_LIST.length) ? window.CLASS_LIST : ['汽車三甲'];
  $('#setup').innerHTML = `<h3>開始</h3>
    <div class="row">班級 <select id="cS">${CLS.map(c => `<option ${c === who.cls ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select>
      組別 <input id="gS" type="number" min="1" max="30" value="${esc(who.grp || 1)}" style="width:64px">
      操作者 <select id="oS">${[1, 2, 3].map(n => `<option ${String(n) === who.op ? 'selected' : ''}>${n}</option>`).join('')}</select></div>
    <div class="hint">每位同學各自完成。不輸入姓名。系統隨機出「膨脹閥＋儲液器」或「毛細管＋蓄液器」車型，外氣 25～35℃。</div>
    <div class="row"><button id="bG">🧭 練習 1：導引</button><button id="bP">📋 練習 2：工作單</button><button class="pri" id="bE">🎫 檢定（15 分鐘）</button></div>
    <div class="hint">練習 1：每一步有提示和理由，紀錄表可隨時檢查。練習 2：只有工作單，重大缺失不中止。<br>檢定：只有工作單；💡 提示卡每次 −5 分、最多 3 次（超過 2 次不及格）；重大缺失立即不及格；80 分以上及格。完成後可選做「進階情境預測」。</div>`;
  const go = mode => { who.cls = $('#cS').value; who.grp = String(Math.min(30, Math.max(1, Math.round(+$('#gS').value || 1)))); who.op = $('#oS').value;
    store.set('act_cls', who.cls); store.set('act_grp', who.grp); store.set('p1_op', who.op);
    $('#setup').innerHTML = `<h3>${esc(who.cls)} 第 ${esc(who.grp)} 組・操作者 ${esc(who.op)}</h3><div class="hint">點畫面上的元件、管路、黃色量測點、檢修錶、工具選擇動作。</div><div class="row"><button id="bR">↺ 重新開始</button></div>`;
    $('#bR').onclick = () => location.reload(); fresh(mode); };
  $('#bG').onclick = () => go('guide'); $('#bP').onclick = () => go('mock'); $('#bE').onclick = () => go('exam');
}
setup();
$('#sv').innerHTML = '<rect width="1000" height="620" fill="#0d1526"/><text x="500" y="280" fill="#e6ecf5" font-size="30" font-weight="700" text-anchor="middle">P0 冷媒循環 實車巡檢</text><text x="500" y="330" fill="#9fb0cf" font-size="18" text-anchor="middle">先在右側選擇班級、組別、操作者，再選練習或檢定</text>';
$('#steps').innerHTML = WORK.map(x => `<li class="wk"><b>${esc(x.t)}</b><br><span class="hint">${esc(x.d)}</span></li>`).join('');
window.__S = () => S; window.__fresh = fresh; window.__act = act;
</script></body></html>
